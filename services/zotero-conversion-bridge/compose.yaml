services:
  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      ZOTERO_READER_HOST: ${ZOTERO_READER_HOST:?set ZOTERO_READER_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      bridge:
        condition: service_healthy
    networks:
      - frontend

  bridge:
    build: .
    restart: unless-stopped
    env_file:
      - path: ${ZOTERO_BRIDGE_ENV_FILE:-.env}
        required: true
    expose:
      - "8000"
    volumes:
      - ${ZOTERO_READER_CACHE_PATH:?set ZOTERO_READER_CACHE_PATH}:/var/lib/zotero-conversion-bridge/cache
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/health', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      docling:
        condition: service_healthy
    networks:
      - frontend
      - conversion

  docling:
    image: quay.io/docling-project/docling-serve-cpu:v1.30.0@sha256:061d35c03611bc15b73d024c8e8387bcf0624279f8b57c16c1567326f214ba56
    restart: unless-stopped
    expose:
      - "5001"
    environment:
      DOCLING_SERVE_API_KEY: ${DOCLING_SERVE_API_KEY:?set DOCLING_SERVE_API_KEY}
      DOCLING_SERVE_ENABLE_UI: "false"
      DOCLING_SERVE_ENABLE_REMOTE_SERVICES: "false"
      DOCLING_SERVE_SHOW_VERSION_INFO: "false"
      DOCLING_SERVE_LOAD_MODELS_AT_BOOT: "false"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_ENG_LOC_SHARE_MODELS: "true"
      DOCLING_SERVE_OPTIONS_CACHE_SIZE: "1"
      DOCLING_SERVE_MAX_FILE_SIZE: ${MAX_PDF_BYTES:-67108864}
      DOCLING_SERVE_MAX_DOCUMENT_TIMEOUT: ${CONVERSION_TIMEOUT_SECONDS:-600}
      DOCLING_SERVE_MAX_SOURCES_PER_REQUEST: "1"
      UVICORN_WORKERS: "1"
    volumes:
      - docling_models:/opt/app-root/src/.cache
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/readyz', timeout=2)"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 2m
    networks:
      - conversion

volumes:
  caddy_data:
  caddy_config:
  docling_models:

networks:
  frontend:
  conversion:
    internal: true
